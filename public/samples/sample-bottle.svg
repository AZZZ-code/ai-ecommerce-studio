<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="户外运动保温杯示例图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0f6ff"/>
      <stop offset="1" stop-color="#e2edff"/>
    </linearGradient>
    <linearGradient id="body" x1="330" y1="180" x2="470" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93b8f7"/>
      <stop offset="0.45" stop-color="#5b8ef0"/>
      <stop offset="1" stop-color="#2f63d6"/>
    </linearGradient>
    <linearGradient id="cap" x1="340" y1="120" x2="460" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3d5068"/>
      <stop offset="1" stop-color="#1f2c3d"/>
    </linearGradient>
    <linearGradient id="shine" x1="360" y1="200" x2="400" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="640" cy="130" r="86" fill="#ffffff" opacity="0.65"/>
  <circle cx="150" cy="470" r="110" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="400" cy="512" rx="150" ry="22" fill="#2f63d6" opacity="0.13"/>

  <!-- 提环 -->
  <path d="M400 96c26 0 44 17 44 38v10" fill="none" stroke="#3d5068" stroke-width="11" stroke-linecap="round"/>

  <!-- 杯盖 -->
  <rect x="336" y="120" width="128" height="74" rx="22" fill="url(#cap)"/>
  <rect x="336" y="150" width="128" height="12" fill="#0f1826" opacity="0.35"/>
  <rect x="352" y="128" width="34" height="9" rx="4.5" fill="#ffffff" opacity="0.35"/>

  <!-- 杯身 -->
  <path d="M338 194h124v250c0 26-21 44-62 44s-62-18-62-44V194z" fill="url(#body)"/>
  <path d="M360 214h20v250c0 14 6 22 14 27-24-3-34-18-34-42V214z" fill="url(#shine)"/>

  <!-- 标签贴纸 -->
  <rect x="352" y="286" width="96" height="86" rx="14" fill="#ffffff" opacity="0.9"/>
  <path d="M400 310l7.5 17.5 17.5 7.5-17.5 7.5L400 360l-7.5-17.5L375 335l17.5-7.5L400 310z" fill="#2f63d6"/>
  <rect x="371" y="352" width="58" height="7" rx="3.5" fill="#93b8f7"/>

  <!-- 刻度线 -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <line x1="430" y1="232" x2="446" y2="232"/>
    <line x1="430" y1="252" x2="446" y2="252"/>
    <line x1="430" y1="272" x2="446" y2="272"/>
  </g>

  <!-- 底部防滑圈 -->
  <rect x="342" y="470" width="116" height="16" rx="8" fill="#1f2c3d" opacity="0.85"/>
</svg>
